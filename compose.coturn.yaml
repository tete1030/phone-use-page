services:
  console:
    environment:
      WEBRTC_TURN_PROVIDER: coturn
      WEBRTC_ICE_MODE: relay
      WEBRTC_TURN_TTL_SECONDS: ${WEBRTC_TURN_TTL_SECONDS:-600}
      COTURN_URL: ${COTURN_URL:?Set the browser-facing TURN URL in your private compose.env}
      COTURN_SERVER_URL: ${COTURN_SERVER_URL:-${COTURN_URL}}
      COTURN_KEY_FILE: /run/secrets/coturn-key
    volumes:
      - type: bind
        source: ${COTURN_KEY_PATH:-./.local/coturn-key.json}
        target: /run/secrets/coturn-key
        read_only: true
        bind:
          create_host_path: false
